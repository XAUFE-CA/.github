# Track GitHub Actions only; this repository has no npm dependencies or lockfile.
# 仅跟踪 GitHub Actions；本仓库没有 npm 依赖或锁文件。
# Add an npm entry if dependencies and a lockfile are introduced.
# 引入 npm 依赖并添加锁文件后，再补充 npm 更新配置。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # GitHub Actions dependencies have no production/development types; group by version instead.
    # GitHub Actions 依赖不区分生产与开发类型，因此按版本变化分组。
    # Group minor/patch updates; review potentially breaking major upgrades separately.
    # 次版本与补丁更新归为一组，可能不兼容的主版本升级单独审查。
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "ci"
