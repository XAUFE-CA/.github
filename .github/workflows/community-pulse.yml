name: Deploy community pulse

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/community-pulse.yml
      - scripts/update-community-pulse.mjs
      - scripts/update-community-pulse.test.mjs
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xca-community-pulse
  cancel-in-progress: false

jobs:
  build:
    name: Build public GitHub activity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify snapshot generator
        run: node --test scripts/update-community-pulse.test.mjs
      - name: Fetch public activity and generate SVG
        run: node scripts/update-community-pulse.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assemble Pages entry point
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>XCA Community Pulse</title>
          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="community-pulse-dark.svg">
            <img src="community-pulse.svg" alt="XCA 公开 GitHub 活动统计" style="width:100%;max-width:1024px">
          </picture>
          </html>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy activity cards to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
